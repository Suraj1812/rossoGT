<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111216">
  <meta name="description" content="Watch a supercar come together in an interactive 3D assembly.">
  <title>Rosso / GT — Supercar Assembly</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23ce2d1e'/%3E%3Cpath d='M8 22 15 10h4l-7 12zm8 0 7-12h3l-7 12z' fill='%23fffaf2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="journey" aria-label="Rosso GT supercar assembly">
    <section class="marker" id="exploded" aria-label="Exploded view"></section>
    <section class="marker" id="assembly" aria-label="Assembly"></section>
    <section class="marker" id="reveal" aria-label="Reveal"></section>
    <div class="screen" data-stage="0">
      <div class="stage" aria-label="Supercar visualization">
        <div class="grid" aria-hidden="true"></div>
        <div class="reticle" aria-hidden="true"><b></b></div>
        <div class="corner tl" aria-hidden="true"></div><div class="corner tr" aria-hidden="true"></div>
        <div class="corner bl" aria-hidden="true"></div><div class="corner br" aria-hidden="true"></div>
        <div class="stage-index"><span class="index-bar"></span><span id="stageLabel">01 / EXPLODED VIEW</span></div>
        <div class="stage-view" id="stageView"></div>
        <canvas id="car" role="img" aria-label="Red supercar components floating in an exploded view"></canvas>
        <div class="title assembly-title" aria-hidden="true"><p>ASSEMBLING <span id="percent">0%</span></p></div>
        <div class="title reveal-title" aria-hidden="true"><h2>FERRARI <span>458</span></h2></div>
        <div class="labels" aria-hidden="true">
          <span class="part-label bonnet"><b>FRONT CLIP</b></span>
          <span class="part-label wheels"><b>WHEEL SET</b></span>
          <span class="part-label cabin"><b>COCKPIT</b></span>
          <span class="part-label engine"><b>REAR CLIP</b></span>
          <span class="part-label brakes"><b>BRAKE DISC</b></span>
          <span class="part-label lights"><b>HEADLAMP</b></span>
        </div>
        <div class="zoom-controls" role="group" aria-label="Model zoom" hidden>
          <button type="button" id="zoomOut" aria-label="Zoom out" disabled>−</button>
          <button type="button" id="zoomIn" aria-label="Zoom in">+</button>
        </div>
        <div class="axis" aria-hidden="true"><i></i><span>X</span><b>Y</b></div>
        <a class="stage-id" href="./assets/credits.html" target="_blank" rel="noopener" aria-label="Model credits" title="Model credits">ⓘ</a>
        <a class="next" href="#assembly" aria-label="Start assembly" title="Start assembly"><span id="nextIcon" aria-hidden="true">↓</span></a>
        <div class="graphics-status" hidden>
          <span role="status">Loading 3D model…</span>
          <button type="button" hidden>Retry</button>
        </div>
        <noscript><p class="graphics-status">Enable JavaScript to view the 3D model.</p></noscript>
      </div>
    </div>
  </main>
  <script>
    const notice = document.querySelector('.graphics-status');
    const message = notice.querySelector('span');
    const retry = notice.querySelector('button');
    notice.hidden = false;
    retry.addEventListener('click', () => location.reload());
    const watchdog = setTimeout(() => {
      message.textContent = 'The 3D model is taking longer than expected.';
      retry.hidden = false;
    }, 8000);
    import('./scene-NVF72WP4.js').then(scene => scene.start()).then(() => {
      notice.hidden = true;
    }).catch(error => {
      message.textContent = 'The 3D model couldn’t load.';
      retry.hidden = false;
      console.error(error);
    }).finally(() => clearTimeout(watchdog));
  </script>
</body>
</html>
