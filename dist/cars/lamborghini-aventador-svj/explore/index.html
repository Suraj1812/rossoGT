      <div class="drive-toolbar">

    </div>

  <script>
    const canvas = document.getElementById('car');
    const statusMessage = document.querySelector('[role="status"]');
    let retry = false;
    function offerRetry(message) {
      retry = true;
      statusMessage.textContent = message + ' Tap the scene or press Enter to retry.';
    }
    canvas.addEventListener('click', () => { if (retry) location.reload(); });
    canvas.addEventListener('keydown', event => {
      if (retry && event.key === 'Enter') location.reload();
    });
    const watchdog = setTimeout(() => offerRetry('The 3D model is taking longer than expected.'), 12000);
    import('/scene-TYBENBPK.js').then(scene => scene.start()).then(() => {
      retry = false;
      statusMessage.textContent = '';
    }).catch(error => {
      offerRetry('The 3D model could not load.');
      console.error(error);
    }).finally(() => clearTimeout(watchdog));
  </script>
